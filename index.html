<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>书城 - 重构示例</title>

  <!-- 引入 Google font（示例）-->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #F8F9FB;
      --card: #FFFFFF;
      --text: #111111;
      --muted: #6B7280;
      --primary: #4B6BFB;
      --accent: #F5E1A4;
      --gap: 16px;
      --radius: 12px;
      --touch: 48px;
      font-family: "Inter", system-ui, -apple-system, "Helvetica Neue", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html,body{height:100%;background:var(--bg);margin:0;color:var(--text);}
    #root{min-height:100%; display:flex; flex-direction:column; align-items:stretch;}
    /* 页面容器（模拟手机宽度） */
    .app {
      max-width:430px;
      margin:0 auto;
      width:100%;
      box-sizing:border-box;
      padding:12px;
    }

    /* 顶部搜索 + 分类 */
    .topbar {
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:12px;
    }
    .search {
      flex:1;
      background:var(--card);
      padding:10px 12px;
      border-radius:18px;
      display:flex;
      align-items:center;
      gap:10px;
      box-shadow: 0 2px 6px rgba(17,17,17,0.04);
    }
    .search input{
      border:0;outline:0;font-size:14px;background:transparent;width:100%;
    }
    .category-scroll {
      display:flex;
      gap:8px;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      padding-bottom:8px;
      margin-bottom:4px;
    }
    .pill {
      white-space:nowrap;
      padding:8px 12px;
      background:rgba(255,255,255,0.6);
      border-radius:999px;
      font-size:13px;
      color:var(--muted);
      flex:0 0 auto;
      box-shadow: 0 1px 3px rgba(17,17,17,0.03);
    }
    .pill.active{
      background:var(--primary);
      color:#fff;
      font-weight:600;
    }

    /* Banner */
    .banner {
      display:flex;
      gap:12px;
      background:linear-gradient(135deg, #ffffff 0%, #f3f5ff 100%);
      padding:14px;
      border-radius:14px;
      align-items:center;
      box-shadow: 0 4px 14px rgba(75,107,251,0.08);
      margin-bottom:var(--gap);
    }
    .banner .cover-large{
      width:32%;
      aspect-ratio:3/4;
      border-radius:10px;
      background:linear-gradient(180deg,#dfe9ff,#fff);
      display:flex;align-items:center;justify-content:center;
      font-size:12px;color:var(--muted);
      box-shadow:0 6px 18px rgba(75,107,251,0.06);
    }
    .banner .right {
      flex:1;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .banner .title {font-size:16px;font-weight:700;}
    .banner .subtitle {font-size:13px;color:var(--muted);}

    /* 榜单卡片（Tab） */
    .tab-bar {
      display:flex;
      gap:12px;
      margin-bottom:12px;
      align-items:center;
    }
    .tab {
      font-weight:600;
      font-size:14px;
      padding:8px 12px;
      border-radius:999px;
      background:transparent;
      color:var(--muted);
      cursor:pointer;
    }
    .tab.active {
      background:var(--card);
      color:var(--text);
      box-shadow: 0 2px 8px rgba(17,17,17,0.04);
    }

    .list-grid{
      display:flex;
      gap:12px;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      padding-bottom:8px;
    }
    .book-card{
      background:var(--card);
      min-width:140px;
      border-radius:12px;
      padding:10px;
      box-sizing:border-box;
      box-shadow: 0 4px 10px rgba(17,17,17,0.03);
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .book-cover{
      width:100%;
      aspect-ratio:3/4;
      border-radius:8px;
      background:linear-gradient(180deg,#efefff,#fff);
      display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;
    }
    .book-title{font-size:14px;font-weight:600;line-height:1.1;}
    .book-sub{font-size:12px;color:var(--muted);}

    /* 编辑精选横滑 */
    .editorial {
      margin-top:var(--gap);
      margin-bottom:var(--gap);
    }
    .editorial .row {
      display:flex;gap:12px;overflow:auto;padding-bottom:8px;
    }
    .editorial-card{
      min-width:220px;
      background:var(--card);
      border-radius:12px;
      padding:12px;
      box-shadow: 0 6px 18px rgba(17,17,17,0.03);
      display:flex;gap:10px;align-items:center;
    }
    .editorial-card .mini-cover{width:60px;aspect-ratio:3/4;border-radius:8px;background:linear-gradient(180deg,#fff7e6,#fff);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;}
    .editorial-card .meta{flex:1}
    .editorial-card .meta .t{font-weight:700;font-size:14px;}
    .editorial-card .meta .s{font-size:12px;color:var(--muted);}

    /* 分类推荐 */
    .category-block{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-bottom:28px;
    }
    .category-card{
      background:var(--card);
      border-radius:12px;
      padding:12px;
      min-height:110px;
      box-shadow: 0 6px 18px rgba(17,17,17,0.03);
      display:flex;flex-direction:column;gap:8px;
    }
    .category-card .first-row{display:flex;gap:8px;align-items:center;}
    .category-card .first-row .c-cover{width:60px;aspect-ratio:3/4;border-radius:8px;background:linear-gradient(180deg,#fff,#f0f8ff);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;}
    .category-card .title{font-weight:700;font-size:14px;}
    .category-card .small-list{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
    .small-item{font-size:13px;color:var(--muted);}

    /* 底部 tab */
    .bottom-tab{
      position:sticky;
      bottom:0;
      background:transparent;
      display:flex;
      gap:6px;
      justify-content:space-between;
      margin-top:6px;
      padding:8px 6px;
    }
    .tab-item{
      background:var(--card);
      flex:1;
      margin:0 4px;
      border-radius:10px;
      padding:8px 6px;
      display:flex;
      flex-direction:column;
      align-items:center;
      font-size:12px;
      color:var(--muted);
      box-shadow: 0 6px 18px rgba(17,17,17,0.03);
    }
    .tab-item strong{font-size:13px;color:var(--text);}

    /* 小屏友好 */
    @media (max-width:420px){
      .app{padding:10px;}
      .book-card{min-width:130px;}
      .editorial-card{min-width:200px;}
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="app" id="app-root"></div>
  </div>

  <!-- React + ReactDOM + Babel (用于示例开发) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <script type="text/babel">

  const { useState, useMemo } = React;

  /* ---------------------------
     假数据（示例）
     --------------------------- */
  const CATEGORIES = ["推荐","言情","玄幻","悬疑","都市","历史","奇幻","青春","职场","穿越","轻小说","科幻"];

  const BOOKS = Array.from({length:12}).map((_,i)=>({
    id:i,
    title: `示例书名 ${i+1}`,
    author: `作者 ${i+1}`,
    coverColor: i%2? '#E8EEFF':'#FFF7E8',
    blurb: '一句话介绍，抓住读者注意力的短句。'
  }));

  const EDITORIAL = Array.from({length:6}).map((_,i)=>({
    id:i, title:`编辑精选 ${i+1}`, subtitle: `为什么要读这本书？${i+1}`
  }));

  /* ---------------------------
     组件：顶部（搜索 + 分类横滑）
     --------------------------- */
  function TopBar({ categories, active, onSelect }) {
    return (
      <div>
        <div className="topbar" role="search">
          <div className="search" aria-label="搜索">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.35-4.35" stroke="#9CA3AF" strokeWidth="2" strokeLinecap="round"/></svg>
            <input placeholder="搜索书名 / 作者 / 标签" />
          </div>
          <div style={{width:44, height:44, background:'var(--card)', borderRadius:12, display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 4px 12px rgba(17,17,17,0.04)'}}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2v20M2 12h20" stroke="var(--muted)" strokeWidth="1.5"/></svg>
          </div>
        </div>

        <div className="category-scroll" aria-label="分类">
          {categories.map((c,idx)=>(
            <div key={c} className={`pill ${active===idx ? 'active' : ''}`} onClick={()=>onSelect(idx)} role="button">
              {c}
            </div>
          ))}
        </div>
      </div>
    );
  }

  /* ---------------------------
     组件：Banner 焦点推荐
     --------------------------- */
  function Banner({ main }) {
    return (
      <div className="banner" role="region" aria-label="焦点推荐">
        <div className="cover-large">封面</div>
        <div className="right">
          <div className="title">{main.title}</div>
          <div className="subtitle">{main.blurb}</div>
          <div style={{marginTop:'auto', display:'flex', gap:8}}>
            <button style={{background:'var(--primary)', color:'#fff', border:0, borderRadius:10, padding:'8px 12px', fontWeight:600}}>立即阅读</button>
            <button style={{background:'transparent', border:'1px solid rgba(17,17,17,0.06)', borderRadius:10, padding:'8px 12px'}}>详情</button>
          </div>
        </div>
      </div>
    );
  }

  /* ---------------------------
     组件：榜单（Tab + 横滑书籍）
     --------------------------- */
  function Charts({ tabs, books }) {
    const [active, setActive] = useState(0);

    // 简单分配数据示例
    const lists = useMemo(()=>tabs.map((t,i)=>books.slice(i*3, i*3+6)), [tabs, books]);

    return (
      <div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center', marginBottom:8}}>
          <div style={{fontWeight:700}}>精选榜单</div>
          <div style={{fontSize:12,color:'var(--muted)'}}>更多</div>
        </div>

        <div className="tab-bar" role="tablist">
          {tabs.map((t,i)=>(
            <div key={t} role="tab" aria-selected={i===active} className={`tab ${i===active ? 'active' : ''}`} onClick={()=>setActive(i)}>{t}</div>
          ))}
        </div>

        <div className="list-grid" aria-live="polite">
          {lists[active].map(b=>(
            <div key={b.id} className="book-card" role="article" aria-label={b.title}>
              <div className="book-cover" style={{background:b.coverColor}}>封面</div>
              <div className="book-title">{b.title}</div>
              <div className="book-sub">{b.author}</div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  /* ---------------------------
     组件：编辑精选横滑
     --------------------------- */
  function Editorial({ items }) {
    return (
      <div className="editorial" aria-label="编辑精选">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center', marginBottom:10}}>
          <div style={{fontWeight:700}}>编辑精选</div>
          <div style={{fontSize:12,color:'var(--muted)'}}>查看更多</div>
        </div>

        <div className="row">
          {items.map(it=>(
            <div key={it.id} className="editorial-card" role="article">
              <div className="mini-cover">封面</div>
              <div className="meta">
                <div className="t">{it.title}</div>
                <div className="s">{it.subtitle}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  /* ---------------------------
     组件：分类推荐（两列）
     --------------------------- */
  function CategoryBlock({ categories }) {
    return (
      <div>
        <div style={{fontWeight:700, marginBottom:10}}>分类推荐</div>
        <div className="category-block">
          {categories.slice(0,6).map((c,idx)=>(
            <div className="category-card" key={c}>
              <div className="first-row">
                <div className="c-cover">封面</div>
                <div>
                  <div className="title">{c}</div>
                  <div style={{fontSize:12,color:'var(--muted)'}}>热门分类 · {Math.floor(Math.random()*1000)} 人在读</div>
                </div>
              </div>
              <div className="small-list">
                <div className="small-item">1. 栗子书名 示例</div>
                <div className="small-item">2. 更好看的示例</div>
                <div className="small-item">3. 第三个示例</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  /* ---------------------------
     底部 Tab 导航
     --------------------------- */
  function BottomTabs(){
    return (
      <div style={{padding:'8px 0'}}>
        <div style={{display:'flex',gap:8}}>
          <div className="tab-item"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M3 12h18" stroke="#CBD5E1" strokeWidth="1.5"/></svg><strong>书架</strong><div style={{fontSize:11,color:'var(--muted)'}}>我的</div></div>
          <div className="tab-item"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="#CBD5E1" strokeWidth="1.5"/></svg><strong>发现</strong><div style={{fontSize:11,color:'var(--muted)'}}>搜索</div></div>
          <div className="tab-item"><svg width="18" height="18" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" stroke="#CBD5E1" strokeWidth="1.5"/></svg><strong>首页</strong><div style={{fontSize:11,color:'var(--muted)'}}>书城</div></div>
          <div className="tab-item"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="#CBD5E1" strokeWidth="1.5"/></svg><strong>版权</strong><div style={{fontSize:11,color:'var(--muted)'}}>IP</div></div>
          <div className="tab-item"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3" stroke="#CBD5E1" strokeWidth="1.5"/><path d="M6 20c1-4 11-4 12 0" stroke="#CBD5E1" strokeWidth="1.5"/></svg><strong>我的</strong><div style={{fontSize:11,color:'var(--muted)'}}>个人</div></div>
        </div>
      </div>
    );
  }

  /* ---------------------------
     页面主 App
     --------------------------- */
  function App(){
    const [activeCat, setActiveCat] = useState(0);

    return (
      <div>
        <TopBar categories={CATEGORIES} active={activeCat} onSelect={i=>setActiveCat(i)} />
        <Banner main={BOOKS[0]} />
        <Charts tabs={["VIP金榜","日榜","新书榜"]} books={BOOKS} />
        <Editorial items={EDITORIAL} />
        <CategoryBlock categories={CATEGORIES} />

        {/* 辅助留白 */}
        <div style={{height:18}} />

        <BottomTabs />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);

  </script>
</body>
</html>
